<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market4u</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#79BE20,#25D366);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
border-radius:28px;
max-width:430px;
width:100%;
padding:34px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
text-align:center;
}

.logo{
width:240px;
max-width:100%;
margin-bottom:10px;
}

h1{
font-size:28px;
color:#222;
margin:12px 0 6px;
}

p{
color:#666;
margin:0 0 28px;
}

.btn{
display:flex;
align-items:center;
gap:16px;
text-decoration:none;
color:#fff;
padding:18px 20px;
border-radius:18px;
margin:14px 0;
font-weight:bold;
font-size:20px;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.icon{
width:44px;
height:44px;
border-radius:50%;
background:rgba(255,255,255,.2);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
flex:none;
}

.sub{
display:block;
font-size:14px;
font-weight:normal;
opacity:.95;
}

.w{background:#25D366;}
.g{background:#3FAE49;}
.pix{background:#79BE20;border:none;width:100%;cursor:pointer;}

#msg{
display:none;
background:#e8f5e9;
color:#2e7d32;
padding:12px;
border-radius:12px;
margin-top:14px;
font-weight:bold;
}

footer{
margin-top:22px;
color:#999;
font-size:13px;
}
</style>

</head>

<body>

<div class="card">

<!-- LOGO EMBUTIDA -->
<img class="logo" src="data:image/png;base64,COLE_AQUI_A_LOGO_BASE64">

<h1>Olá! 👋</h1>
<p>Escolha uma das opções abaixo.</p>

<!-- WHATSAPP -->
<a class="btn w" href="https://wa.me/5511926322503">
<div class="icon">💬</div>
<div>
Fale Conosco
<span class="sub">Atendimento via WhatsApp</span>
</div>
</a>

<!-- GRUPO -->
<a class="btn g" href="https://chat.whatsapp.com/DJTt49VjxekFfBYiXbVPlV">
<div class="icon">🎁</div>
<div>
Grupo de Promoções
<span class="sub">Receba ofertas exclusivas</span>
</div>
</a>

<!-- PIX -->
<button class="btn pix" onclick="copiar()">
<div class="icon">💳</div>
<div>
Teve problema ao pagar?
<span class="sub">Copiar chave PIX</span>
</div>
</button>

<div id="msg">✅ Chave PIX copiada com sucesso!</div>

<footer>Obrigado pela preferência ❤️</footer>

</div>

<script>
function copiar(){
navigator.clipboard.writeText("7cd250a1-330b-46e2-8a02-785b8de57355");
const m=document.getElementById('msg');
m.style.display='block';
setTimeout(()=>m.style.display='none',2500);
}
</script>

</body>
</html>
